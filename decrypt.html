<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>菌护禾 · 面试结果查看</title>
<meta name="description" content="粘贴邮件全文即可查看菌护禾面试结果（团队内部使用）。" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div>
      <h1>面试结果查看</h1>
      <p class="sub">菌护禾 · 团队内部使用</p>
    </div>
  </div>
  <div class="topbar-right">
    <a class="btn small ghost" href="./">返回招募页</a>
  </div>
</header>

<main>
  <p class="hint">把同学发来的邮件全文直接粘贴到下面，再粘贴你的私钥，点「解密」即可。不需要选择文件。</p>

  <section class="card">
    <h2>1. 粘贴邮件全文</h2>
    <textarea id="pkg-text" rows="10" placeholder="把整封邮件（含 ===== 前后所有文字）粘贴到这里即可，系统会自动找到加密内容。"></textarea>
    <div class="row">
      <button id="btn-clear-pkg" class="btn small ghost" type="button">清空</button>
    </div>
  </section>

  <section class="card">
    <h2>2. 粘贴私钥</h2>
    <textarea id="key-text" rows="6" placeholder="-----BEGIN PRIVATE KEY-----&#10;…&#10;-----END PRIVATE KEY-----"></textarea>
    <div class="row">
      <button id="btn-clear-key" class="btn small ghost" type="button">清空</button>
    </div>
    <p class="hint">私钥只在本机浏览器使用，不上传、不保存。</p>
  </section>

  <section class="card">
    <div class="row">
      <button id="btn-decrypt" class="btn primary" type="button">解密</button>
      <button id="btn-print" class="btn ghost" type="button" disabled>打印 / 存 PDF</button>
      <button id="btn-save-json" class="btn ghost" type="button" disabled>下载明文 JSON</button>
    </div>
    <p id="status" class="hint"></p>
  </section>

  <section class="card hidden" id="result-card">
    <h2>面试结果</h2>
    <div id="result"></div>
  </section>

  <p class="disclaimer">团队内部工具，请勿把私钥发给他人。</p>
</main>

<div id="toast" class="toast hidden" role="status"></div>

<script src="assets/decrypt.js"></script>
</body>
</html>
